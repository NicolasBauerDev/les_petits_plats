<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Les Petits Plats</title>
        <link href="./public/build/styles/style.css" rel="stylesheet" />
    </head>
    <body>
        <!-- Hero + Form -->
        <header class="relative flex flex-col bg-[url(/assets/hero.webp)] bg-cover bg-center lg:h-[60vh]">
            <div class="absolute inset-0 z-0 bg-linear-to-b from-[#1b1b1b80] to-[#1b1b1b80]"></div>
            <div role="group" class="z-1 flex h-full flex-col">
                <img src="./public/img/logo.svg" alt="Logo officiel" class="absolute top-[51px] left-[69px] w-2/12" />
                <div role="group" class="flex h-full flex-col items-center justify-center">
                    <h1 class="max-w-[890px] text-center text-[44px] text-regular-yellow uppercase">
                        Cherchez parmi plus de 1500 recettes du quotidien, simples et délicieuses
                    </h1>
                    <form id="form-search" class="mt-8 flex h-fit w-1/2 flex-row rounded-xl bg-white py-3 pr-[10px] pl-[35px]">
                        <input id="main-search" type="text" name="search" placeholder="Rechercher une recette..." class="w-full" />
                        <button type="submit" class="rounded-xl bg-regular-black p-3 hover:cursor-pointer">
                            <svg
                                width="28"
                                height="29"
                                viewBox="0 0 28 29"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <circle cx="10" cy="10.4219" r="9.5" stroke="white" />
                                <line x1="18.3536" y1="19.0683" x2="27.3536" y2="28.0683" stroke="white" />
                            </svg>
                        </button>
                    </form>
                </div>
            </div>
        </header>
        <main class="flex w-screen flex-col bg-regular-light-gray p-8 lg:py-0 lg:px-[104px] lg:pb-52 lg:gap-5">
            <!-- Filtres + Nb Recettes -->
            <div role="group" class="flex justify-between">
                <!-- Liste filtres -->
                <div role="group" class="flex lg:gap-16">
                    <!-- Ingrédients -->
                    <article id="ingredients" class="flex gap-[63px] lg:mt-5" role="group">
                        <div class="w-[195px] flex-1/3 rounded-xl bg-white" aria-label="Liste déroulante ingrédients">
                            <header class="flex items-center justify-between p-4">
                                <span>Ingrédients</span>
                                <img src="assets/arrow_down.svg" alt="flèche vers le bas" aria-label="Ouvrir liste filtre"/>
                            </header>
                            <div class="dropdown-panel" id="panel-ingredients">
                                <div class="px-4">
                                    <div class="flex w-full justify-between items-center border-regular-light-gray border rounded-xs py-2 pl-2 pr-4">
                                        <input type="text" placeholder="Rechercher…" class="w-full text-sm" />
                                        <div class="flex items-center gap-2">
                                            <img src="assets/close_input.svg" alt="icône de supression de texte">
                                            <img src="assets/search_input.svg" alt="icône de recherche">
                                        </div>
                                    </div>
                                </div>
                                <div role="listbox" class="list-select mt-3 max-h-64 overflow-scroll" tabindex="0">
                                </div>
                            </div>
                        </div>
                    </article>
                    <!-- Appareils -->

                    <!-- Ustensils -->

                </div>
                <!-- Nombre de recettes affiché -->
                <div role="note" class="lg:mt-10">
                    <h2 class="text-xl"><span id="recipes_count">NN</span></h2>
                </div>
            </div>
            <!-- Liste items selectionnés -->
            <div role="group" class="flex lg:gap-16">
                <div class="bg-regular-yellow flex justify-between px-5 py-4 lg:w-52 rounded-xl">
                    <span class="font-manrope font-normal text-sm">Crème de coco</span>
                    <img class="cursor-pointer" src="assets/close_selection.svg" alt="Fermer"/>
                </div>
            </div>
            <!-- Listes recettes -->
            <div role="group" id="list-recipes" class="flex gap-y-16 lg:gap-x-12 flex-wrap lg:mt-[23px]">
            </div>
        </main>
        <script type="module" src="src/scripts/main.js"></script>
    </body>
</html>
